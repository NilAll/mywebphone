<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>CloudOS - Nil All InfoTech</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        html, body { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        .main-wrapper { position: relative; width: 100%; height: 100dvh; display: flex; flex-direction: column; }
        .ios-blur { background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .wallpaper { position: absolute; inset: 0; z-index: 0; width: 100%; height: 100%; object-fit: cover; }
        .app-window { position: fixed; inset: 0; z-index: 200; background: #000; display: flex; flex-direction: column; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .hide-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body x-data="cloudOS()" x-init="init()" class="text-white font-sans">

    <div x-show="!isLoggedIn" class="fixed inset-0 z-[1000] bg-zinc-950 flex flex-col items-center justify-center p-6 text-center">
        <div class="w-20 h-20 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-3xl mb-6 flex items-center justify-center shadow-2xl shrink-0">
            <i data-lucide="smartphone" class="w-10 h-10 text-white font-bold"></i>
        </div>
        <h1 class="text-3xl font-bold mb-1" x-text="authMode === 'login' ? 'CloudOS' : 'Nova Conta'"></h1>
        <p class="text-zinc-500 mb-8 text-sm font-medium">Nil All InfoTech - Virtual Mobile</p>
        
        <div class="w-full max-w-xs space-y-3">
            <template x-if="authMode === 'signup'">
                <input type="text" x-model="authField.fullName" placeholder="Nome Completo" class="w-full p-4 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none text-white text-base">
            </template>
            <input type="email" x-model="authField.email" @keyup.enter="handleAuthAction" placeholder="E-mail" class="w-full p-4 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none text-white text-base">
            <input type="password" x-model="authField.pass" @keyup.enter="handleAuthAction" placeholder="Senha" class="w-full p-4 rounded-2xl bg-zinc-900 border border-zinc-800 outline-none text-white text-base">
            <button @click="handleAuthAction" class="w-full py-4 bg-white text-black font-extrabold rounded-2xl active:scale-95 transition-all text-base uppercase shadow-lg">
                <span x-show="!loading" x-text="authMode === 'login' ? 'ENTRAR' : 'CADASTRAR'"></span>
                <span x-show="loading">Conectando...</span>
            </button>
            <button @click="authMode = authMode === 'login' ? 'signup' : 'login'" class="w-full py-2 text-blue-400 text-sm font-medium">
                <span x-text="authMode === 'login' ? 'Criar nova conta' : 'Já tem conta? Login'"></span>
            </button>
        </div>
    </div>

    <div class="main-wrapper" x-show="isLoggedIn" x-cloak>
        <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe" class="wallpaper">

        <header class="relative z-50 flex justify-between items-center px-6 pt-5 pb-2 text-[11px] font-bold drop-shadow-md shrink-0">
            <span x-text="currentTime"></span>
            <div class="flex items-center gap-3">
                <button @click="showInfoModal = true" class="p-1.5 bg-black/20 rounded-full border border-white/10 active:scale-90 transition">
                    <i data-lucide="info" class="w-4 h-4 text-zinc-300"></i>
                </button>
                <div class="flex items-center gap-1.5"><i data-lucide="wifi" class="w-3.5 h-3.5"></i><i data-lucide="battery" class="w-4 h-4 text-green-400"></i></div>
            </div>
        </header>

        <main class="flex-1 relative z-10 grid grid-cols-4 gap-y-8 px-6 pt-10 justify-items-center content-start overflow-y-auto hide-scroll pb-32">
            <div @click="activeChat = true" class="flex flex-col items-center gap-1.5 cursor-pointer active:scale-90 transition text-center">
                <div class="w-16 h-16 bg-green-500 rounded-[22%] flex items-center justify-center shadow-xl border border-white/10">
                    <i data-lucide="message-circle" class="w-10 h-10 fill-white/10"></i>
                </div>
                <span class="text-[11px] font-medium drop-shadow-md">Mensagens</span>
            </div>
        </main>
        
        <footer class="absolute bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-sm h-20 ios-blur rounded-[38px] flex items-center justify-around px-4 z-40 border border-white/10">
            <div class="w-14 h-14 bg-white rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition"><i data-lucide="search" class="w-7 h-7 text-blue-600"></i></div>
            <div @click="logout()" class="w-14 h-14 bg-rose-600 rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition"><i data-lucide="power" class="w-7 h-7 text-white font-bold"></i></div>
        </footer>

        <div x-show="activeChat" class="app-window" x-cloak>
            <header class="h-16 flex items-center justify-between px-4 border-b border-zinc-800 bg-zinc-950">
                <button @click="activeChat = false" class="text-blue-500 font-bold">Voltar</button>
                <span class="font-bold">Mensagens</span>
                <div class="w-10"></div>
            </header>
            <div class="flex-1 flex flex-col items-center justify-center text-zinc-500 p-8 text-center">
                <i data-lucide="message-square" class="w-12 h-12 mb-4 opacity-20"></i>
                <p>O chat está sendo conectado às tabelas do seu Supabase...</p>
            </div>
        </div>

        <div x-show="showInfoModal" @click.self="showInfoModal = false" class="fixed inset-0 z-[800] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm" x-cloak>
            <div class="bg-zinc-900 w-full max-w-xs rounded-[35px] border border-white/10 shadow-2xl overflow-hidden">
                <div class="p-6 text-center border-b border-white/5 bg-white/5">
                    <div class="w-16 h-16 bg-blue-600 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg text-xl font-bold" x-text="userEmail ? userEmail[0].toUpperCase() : '?'"></div>
                    <h2 class="text-lg font-bold" x-text="userFullName"></h2>
                    <p class="text-xs text-blue-400 font-mono" x-text="userEmail"></p>
                </div>
                <div class="p-6 space-y-4">
                    <div class="flex justify-between items-center"><span class="text-[10px] text-zinc-500 uppercase font-bold">Sistema</span><span class="text-xs text-zinc-300">CloudOS v2.0</span></div>
                    <div class="flex justify-between items-center"><span class="text-[10px] text-zinc-500 uppercase font-bold">Sessão</span><span class="text-xs text-zinc-300">Expira às 23:59</span></div>
                    <button @click="showInfoModal = false" class="w-full py-3 bg-zinc-800 rounded-2xl text-sm font-bold active:bg-zinc-700 transition">Fechar</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const sb = supabase.createClient('https://lzdroenqflqmcxojlkap.supabase.co', 'sb_publishable_6Uy3BYLO0Igiyz_Q8iQeNQ_TvIaLbri');

        function cloudOS() {
            return {
                isLoggedIn: false, authMode: 'login', loading: false,
                currentTime: '', showInfoModal: false, activeChat: false,
                userEmail: '', userFullName: '',
                authField: { email: '', pass: '', fullName: '' },

                async init() {
                    this.updateTime();
                    setInterval(() => this.updateTime(), 1000);
                    
                    const { data: { session } } = await sb.auth.getSession();
                    const lastLogin = localStorage.getItem('c_last_login');
                    if (session && lastLogin === new Date().toDateString()) {
                        this.isLoggedIn = true;
                        this.userEmail = session.user.email;
                        this.userFullName = session.user.user_metadata.full_name || 'Usuário';
                    }
                    lucide.createIcons();
                },

                updateTime() {
                    this.currentTime = new Date().toLocaleTimeString('pt-br', { hour: '2-digit', minute: '2-digit' });
                },

                async handleAuthAction() {
                    this.loading = true;
                    try {
                        let result;
                        if (this.authMode === 'login') {
                            result = await sb.auth.signInWithPassword({ email: this.authField.email, password: this.authField.pass });
                        } else {
                            result = await sb.auth.signUp({ 
                                email: this.authField.email, 
                                password: this.authField.pass, 
                                options: { data: { full_name: this.authField.fullName } } 
                            });
                        }
                        if (result.error) throw result.error;
                        if (result.data.user) {
                            localStorage.setItem('c_last_login', new Date().toDateString());
                            this.isLoggedIn = true;
                            location.reload();
                        }
                    } catch (e) {
                        alert(e.message);
                    } finally {
                        this.loading = false;
                        lucide.createIcons();
                    }
                },

                async logout() {
                    await sb.auth.signOut();
                    localStorage.removeItem('c_last_login');
                    location.reload();
                }
            }
        }
    </script>
</body>
</html>
